# Ambiente local do GameShelf.
#
#   cp .env.example .env        # e defina JWT_ACCESS_SECRET
#   docker compose up -d --build
#
# Serviços sem `profiles` formam o ambiente básico e sempre sobem.
# Perfis adicionais (search, observability, analytics) entram nas próximas etapas.

name: gameshelf

x-database-url: &database-url postgresql://${POSTGRES_USER:-gameshelf}:${POSTGRES_PASSWORD:-gameshelf}@postgres:5432/${POSTGRES_DB:-gameshelf}

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gameshelf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gameshelf}
      POSTGRES_DB: ${POSTGRES_DB:-gameshelf}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      # A partir do PostgreSQL 18 a imagem usa /var/lib/postgresql (não mais .../data).
      - pgdata:/var/lib/postgresql
    healthcheck:
      # -h 127.0.0.1: evita considerar "pronto" o servidor temporário da inicialização.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Executa `prisma migrate deploy` uma vez e termina. A API só sobe depois dele.
  migrate:
    build:
      context: ./apps/api
      target: migrate
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: ./apps/api
      target: runtime
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: *database-url
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?defina JWT_ACCESS_SECRET no .env (veja .env.example)}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      REFRESH_TOKEN_IDLE_DAYS: ${REFRESH_TOKEN_IDLE_DAYS:-7}
      SESSION_ABSOLUTE_DAYS: ${SESSION_ABSOLUTE_DAYS:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
